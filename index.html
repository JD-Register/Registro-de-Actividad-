<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiempo de Campo Pro</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <link rel="manifest" href="manifest.json">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1A73E8',
                        secondary: '#5F6368',
                        accent: '#10B981',
                        danger: '#EF4444',
                        glass: 'rgba(255, 255, 255, 0.7)',
                    },
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        h1,
        h2,
        h3 {
            font-family: 'Outfit', sans-serif;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .nav-item.active {
            color: #1A73E8;
        }
        .nav-item.active i {
            transform: translateY(-4px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #E2E8F0;
            border-radius: 10px;
        }
        .tab-btn.active {
            border-bottom: 3px solid #1A73E8;
            color: #1A73E8;
            font-weight: 600;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .animate-slide-up {
            animation: slideUp 0.4s ease-out forwards;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            15% {
                opacity: 1;
                transform: translateY(0);
            }
            85% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        }
        .fullscreen-hint {
            animation: fadeInOut 4s ease-in-out forwards;
        }

        .calendar-day.today {
            border: 2px solid #1A73E8;
        }
        .calendar-day.has-activity::after {
            content: '';
            display: block;
            width: 4px;
            height: 4px;
            background: #1A73E8;
            border-radius: 50%;
            margin: 0 auto;
        }
        .no-select {
            user-select: none;
        }

        #rv {
            display: none;
        }

        .bar-chart-bar {
            transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .streak-glow {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .capture-area {
            background: #f8fafc !important;
        }
        .capture-area .bg-white {
            background: #ffffff !important;
        }
        .capture-area .bg-slate-800 {
            background: #1e293b !important;
        }

        /* NUEVO: Estilos para el time picker tipo reloj */
        .time-picker-btn {
            transition: all 0.15s ease;
        }
        .time-picker-btn:active {
            transform: scale(0.9);
            background: #e2e8f0;
        }
        .time-picker-display {
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden">

    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center z-20">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white font-bold text-xl">T</div>
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">Tiempo de Campo <span class="text-primary">Pro</span></h1>
        </div>
        <div id="service-year-badge" class="text-[10px] uppercase font-bold tracking-widest text-slate-400 bg-slate-100 px-2 py-1 rounded">
            SEP - AGO
        </div>
    </header>

    <main id="app-container" class="flex-1 overflow-y-auto px-4 py-6 custom-scrollbar pb-24 relative"></main>

    <nav class="fixed bottom-0 left-0 right-0 glass-morphism border-t border-slate-200 px-2 py-2 z-30 flex justify-around items-center">
        <button onclick="switchView('hoy')" class="nav-item flex flex-col items-center gap-1 p-2 transition-all duration-300 active:scale-95" id="nav-hoy">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[10px] font-medium">Hoy</span>
        </button>
        <button onclick="switchView('registro')" class="nav-item flex flex-col items-center gap-1 p-2 transition-all duration-300 active:scale-95 text-slate-400" id="nav-registro">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span class="text-[10px] font-medium">Historial</span>
        </button>
        <button onclick="switchView('estudios')" class="nav-item flex flex-col items-center gap-1 p-2 transition-all duration-300 active:scale-95 text-slate-400" id="nav-estudios">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <span class="text-[10px] font-medium">Estudios</span>
        </button>
        <button onclick="switchView('revisitas')" class="nav-item flex flex-col items-center gap-1 p-2 transition-all duration-300 active:scale-95 text-slate-400" id="nav-revisitas">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span class="text-[10px] font-medium">Revisitas</span>
        </button>
        <button onclick="switchView('stats')" class="nav-item flex flex-col items-center gap-1 p-2 transition-all duration-300 active:scale-95 text-slate-400" id="nav-stats">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            <span class="text-[10px] font-medium">Análisis</span>
        </button>
        <button onclick="switchView('ajustes')" class="nav-item flex flex-col items-center gap-1 p-2 transition-all duration-300 active:scale-95 text-slate-400" id="nav-ajustes">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span class="text-[10px] font-medium">Más</span>
        </button>
    </nav>

    <div id="modal-container" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden"></div>
    <div id="notification-overlay" class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] transform scale-0 transition-transform duration-300">
        <div class="bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3">
            <span id="notification-text">Registrado con éxito</span>
        </div>
    </div>

    <!-- NUEVO: Notificación persistente del cronómetro (se muestra cuando está en segundo plano) -->
    <div id="chrono-background-notification" class="fixed top-4 right-4 z-[70] bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 transform scale-0 transition-transform duration-300">
        <div class="w-3 h-3 bg-accent rounded-full animate-pulse"></div>
        <span id="chrono-bg-time" class="font-bold tabular-nums text-lg">00:00:00</span>
        <span class="text-xs text-slate-400">en curso</span>
    </div>

    <script>
        // --- APP STATE & STORAGE ---
        const STORAGE_KEY = 'TiempoCampoPro_v3_State';

        let state = {
            userSettings: {
                userType: 'Regular',
                annualGoal: 600,
                monthlyGoal: 50,
                weeklyGoal: 12.5,
            },
            dailyRecords: [],
            studies: [],
            revisits: [],
            chronometer: {
                accumulatedMs: 0,
                startTime: null,
                state: 'Stopped',
            },
            appVersion: '3.0.0',
            lastBackupDate: null,
        };

        let chronoInterval = null;
        let currentView = 'hoy';
        let historialFilterMonth = null;
        let historialSearchTerm = '';
        let fullscreenActivated = false;

        // NUEVO: Variables para el time picker y wake lock
        let _timePickerMinutes = 0;
        let wakeLock = null;
        let wakeLockSupported = false;
        let chronoNotificationInterval = null;
        let notificationsPermission = 'default';

        // --- CORE UTILS ---
        function saveState() {
            state.lastBackupDate = getDateStr(new Date());
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                    if (!state.chronometer.accumulatedMs && state.chronometer.accumulatedMs !== 0) state.chronometer
                        .accumulatedMs = 0;
                    if (!state.chronometer.startTime) state.chronometer.startTime = null;
                    if (!state.chronometer.state) state.chronometer.state = 'Stopped';
                    if (!state.appVersion) state.appVersion = '3.0.0';
                    if (!state.userSettings.weeklyGoal) state.userSettings.weeklyGoal = state.userSettings.monthlyGoal / 4;
                } catch (e) { console.error(e); }
            }
            if (!state.dailyRecords) state.dailyRecords = [];
            if (!state.studies) state.studies = [];
            if (!state.revisits) state.revisits = [];
            state.revisits.forEach(r => {
                if (!r.plannedVisitDate) r.plannedVisitDate = null;
                if (!r.priority) r.priority = 'Normal';
            });
            state.dailyRecords.forEach(r => {
                if (!r.attendedStudies) r.attendedStudies = [];
                if (!r.attendedRevisits) r.attendedRevisits = [];
            });

            // NUEVO: Si el cronómetro estaba corriendo al recargar, recalcular el tiempo acumulado
            if (state.chronometer.state === 'Running' && state.chronometer.startTime) {
                const elapsed = Date.now() - state.chronometer.startTime;
                state.chronometer.accumulatedMs += elapsed;
                state.chronometer.startTime = Date.now(); // Reiniciar startTime para seguir corriendo
                // Lo dejamos en Running para que el intervalo lo retome
            }
        }

        function notify(msg) {
            const el = document.getElementById('notification-overlay');
            const text = document.getElementById('notification-text');
            text.innerText = msg;
            el.classList.remove('scale-0');
            el.classList.add('scale-100');
            setTimeout(() => {
                el.classList.remove('scale-100');
                el.classList.add('scale-0');
            }, 2500);
        }

        function formatTime(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function getMinutesFromMs(ms) {
            return Math.floor(ms / 60000);
        }

        function getServiceYearRange() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            let startYear = (month >= 8) ? year : year - 1;
            let endYear = startYear + 1;
            return {
                start: new Date(startYear, 8, 1),
                end: new Date(endYear, 7, 31)
            };
        }

        function getDateStr(d) {
            return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
        }

        function getMondayOfWeek(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        function getWeekStr(d) {
            const monday = getMondayOfWeek(d);
            return getDateStr(monday);
        }

        // --- FULLSCREEN ---
        function activateFullscreen() {
            if (fullscreenActivated) return;
            fullscreenActivated = true;
            const hint = document.getElementById('fullscreen-hint');
            if (hint) {
                hint.style.opacity = '0';
                hint.style.transition = 'opacity 0.3s';
                setTimeout(() => hint.remove(), 300);
            }
            const doc = document.documentElement;
            if (doc.requestFullscreen) {
                doc.requestFullscreen().catch(() => {});
            } else if (doc.webkitRequestFullscreen) {
                doc.webkitRequestFullscreen();
            } else if (doc.msRequestFullscreen) {
                doc.msRequestFullscreen();
            }
        }

        document.addEventListener('click', function fullscreenHandler(e) {
            if (!fullscreenActivated) {
                activateFullscreen();
            }
        }, { once: false });

        document.addEventListener('touchstart', function fullscreenHandlerTouch(e) {
            if (!fullscreenActivated) {
                activateFullscreen();
            }
        }, { once: false });
        // --- NAVIGATION ---
        function switchView(viewId) {
            currentView = viewId;
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.add('text-slate-400'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`nav-${viewId}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('active');
            }
            renderView();
        }

        function renderView() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            switch (currentView) {
                case 'hoy':
                    renderHoyView(container);
                    break;
                case 'registro':
                    renderRegistroView(container);
                    break;
                case 'estudios':
                    renderEstudiosView(container);
                    break;
                case 'revisitas':
                    renderRevisitasView(container);
                    break;
                case 'stats':
                    renderStatsView(container);
                    break;
                case 'ajustes':
                    renderAjustesView(container);
                    break;
            }
        }

        // --- STREAK CALCULATION ---
        function calculateStreak() {
            if (state.dailyRecords.length === 0) return 0;
            const sortedDates = [...new Set(state.dailyRecords.filter(r => r.totalMinutes > 0).map(r => r.date))].sort()
                .reverse();
            if (sortedDates.length === 0) return 0;
            let streak = 0;
            const today = getDateStr(new Date());
            const yesterday = getDateStr(new Date(Date.now() - 86400000));
            let checkDate = (sortedDates[0] === today || sortedDates[0] === yesterday) ? new Date(sortedDates[0] +
                'T12:00:00') : null;
            if (!checkDate) return 0;
            const checkStr = getDateStr(checkDate);
            if (checkStr !== today && checkStr !== yesterday) return 0;
            for (let i = 0; i < sortedDates.length; i++) {
                const d = new Date(sortedDates[i] + 'T12:00:00');
                const expected = new Date(checkDate.getTime() - (streak * 86400000));
                if (getDateStr(d) === getDateStr(expected)) {
                    streak++;
                } else if (i === 0) {
                    continue;
                } else {
                    break;
                }
            }
            return streak;
        }

        // --- HOY VIEW ---
        function renderHoyView(container) {
            const todayStr = getDateStr(new Date());
            const todayRecord = state.dailyRecords.find(r => r.date === todayStr);
            const totalMinutesToday = todayRecord ? todayRecord.totalMinutes : 0;
            const streak = calculateStreak();
            const weeklyHrs = getWeeklyHours();
            const weeklyGoal = state.userSettings.weeklyGoal || (state.userSettings.monthlyGoal / 4);
            let content = `
                <div class="animate-slide-up">
                    <div class="mb-6">
                        <h2 class="text-3xl font-bold text-slate-800">Hola de nuevo</h2>
                        <p class="text-slate-500 font-medium">${new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
                        ${streak >= 3 ? `<div class="mt-2 inline-flex items-center gap-2 bg-accent/10 text-accent px-3 py-1.5 rounded-full"><span class="text-xl">🔥</span><span class="text-sm font-bold">¡${streak} días de racha!</span></div>` : ''}
                    </div>
                    <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 mb-6 flex flex-col items-center">
                        <span class="text-slate-400 font-bold uppercase tracking-tighter text-xs mb-2">Actividad en curso</span>
                        <div id="chrono-display" class="text-6xl font-black text-slate-800 mb-8 tabular-nums">00:00:00</div>
                        <div class="flex gap-4 w-full flex-wrap">
                            <button id="chrono-start-btn" onclick="startChrono()" class="flex-1 min-w-[80px] bg-primary text-white py-4 rounded-2xl font-bold shadow-lg shadow-primary/20 active:scale-95 transition-all">Iniciar</button>
                            <button id="chrono-pause-btn" onclick="pauseChrono()" class="hidden flex-1 min-w-[80px] bg-amber-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-amber-500/20 active:scale-95 transition-all">Pausar</button>
                            <button id="chrono-stop-btn" onclick="stopChrono()" class="hidden flex-1 min-w-[80px] bg-slate-800 text-white py-4 rounded-2xl font-bold active:scale-95 transition-all">Detener</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                            <p class="text-slate-400 text-xs font-bold uppercase mb-1">Hoy</p>
                            <p class="text-2xl font-bold text-slate-800">${(totalMinutesToday / 60).toFixed(1)} <span class="text-sm font-medium text-slate-400">hrs</span></p>
                        </div>
                        <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                            <p class="text-slate-400 text-xs font-bold uppercase mb-1">Esta Semana</p>
                            <p class="text-2xl font-bold text-slate-800">${weeklyHrs.toFixed(1)} <span class="text-sm font-medium text-slate-400">/ ${weeklyGoal.toFixed(1)}</span></p>
                        </div>
                        <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                            <p class="text-slate-400 text-xs font-bold uppercase mb-1">Mensual</p>
                            <p class="text-2xl font-bold text-slate-800">${getMonthlyHours().toFixed(1)} <span class="text-sm font-medium text-slate-400">/ ${state.userSettings.monthlyGoal}</span></p>
                        </div>
                        <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                            <p class="text-slate-400 text-xs font-bold uppercase mb-1">Racha</p>
                            <p class="text-2xl font-bold text-slate-800">${streak} <span class="text-sm font-medium text-slate-400">días</span></p>
                        </div>
                    </div>
                    <div class="bg-primary/5 rounded-3xl p-6 border border-primary/10">
                        <h3 class="font-bold text-primary mb-4">Plan para hoy</h3>
                        <div id="today-plan-list" class="space-y-3"></div>
                    </div>
                </div>
            `;
            container.innerHTML = content;
            updateChronoUI();
            renderTodayPlan();
        }

        function renderTodayPlan() {
            const planList = document.getElementById('today-plan-list');
            if (!planList) return;
            const todayStr = getDateStr(new Date());
            const plannedStudies = state.studies.filter(s => s.sessions?.some(ses => ses.date === todayStr));
            const plannedRevisits = state.revisits.filter(r => r.plannedVisitDate === todayStr);
            if (plannedStudies.length === 0 && plannedRevisits.length === 0) {
                planList.innerHTML =
                    `<p class="text-slate-400 text-sm">No hay planes específicos para hoy. ¡Añade estudios o revisitas!</p>`;
                return;
            }
            planList.innerHTML = '';
            plannedStudies.forEach(s => {
                planList.innerHTML +=
                    `<div class="flex items-center gap-3 bg-white p-3 rounded-2xl"><div class="w-2 h-2 bg-accent rounded-full"></div><span class="text-sm font-semibold text-slate-700">${s.name} (Estudio)</span></div>`;
            });
            plannedRevisits.forEach(r => {
                planList.innerHTML +=

        function getWeeklyHours() {
            const now = new Date();
            const monday = getMondayOfWeek(now);
            const sunday = new Date(monday.getTime() + 6 * 86400000);
            return state.dailyRecords.filter(r => {
                const d = new Date(r.date + 'T12:00:00');
                return d >= monday && d <= sunday;
            }).reduce((acc, curr) => acc + (curr.totalMinutes / 60), 0);

                        <div id="time-picker-minutes" class="time-picker-display text-5xl font-black text-slate-800 my-2 w-20 text-center select-none">${mins.toString().padStart(2,'0')}</div>
                        <button type="button" onclick="adjustTimePicker('minutes', -5)" class="time-picker-btn w-14 h-12 bg-slate-100 hover:bg-slate-200 rounded-2xl text-slate-600 font-bold text-lg transition-all select-none">−</button>
                        <span class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-wider">Min</span>
                    </div>

        function adjustTimePicker(unit, delta) {
            let hours = parseInt(document.getElementById('time-picker-hours')?.textContent || '0');
            let minutes = parseInt(document.getElementById('time-picker-minutes')?.textContent || '0');

            if (unit === 'hours') {
                hours = Math.max(0, Math.min(23, hours + delta));
            } else if (unit === 'minutes') {
                minutes += delta;
                if (minutes >= 60) {
                    minutes -= 60;
                    hours = Math.min(23, hours + 1);
                } else if (minutes < 0) {
                    minutes += 60;
                    hours = Math.max(0, hours - 1);
                }
                minutes = Math.max(0, Math.min(59, minutes));
                // Redondear a múltiplos de 5 para mantener consistencia con los botones
                minutes = Math.round(minutes / 5) * 5;
                if (minutes === 60) {
                    minutes = 0;
                    hours = Math.min(23, hours + 1);
                }
            }

            _timePickerMinutes = hours * 60 + minutes;

            const hoursEl = document.getElementById('time-picker-hours');
            const minsEl = document.getElementById('time-picker-minutes');
            const totalEl = document.getElementById('time-picker-total');
            if (hoursEl) hoursEl.textContent = hours.toString().padStart(2, '0');
            if (minsEl) minsEl.textContent = minutes.toString().padStart(2, '0');
            if (totalEl) totalEl.textContent = `${hours}h ${minutes}m`;
        }

        function getTimePickerTotalMinutes() {
            return _timePickerMinutes;
        }

        function setTimePickerMinutes(minutes) {
            _timePickerMinutes = Math.max(0, minutes);
            const hours = Math.floor(_timePickerMinutes / 60);
            const mins = _timePickerMinutes % 60;
            const hoursEl = document.getElementById('time-picker-hours');
            const minsEl = document.getElementById('time-picker-minutes');
            const totalEl = document.getElementById('time-picker-total');
            if (hoursEl) hoursEl.textContent = hours.toString().padStart(2, '0');
            if (minsEl) minsEl.textContent = mins.toString().padStart(2, '0');
            if (totalEl) totalEl.textContent = `${hours}h ${mins}m`;
        }

        // --- NUEVO: Wake Lock para mantener el cronómetro activo ---
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                wakeLockSupported = true;
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        // Si se liberó y el cronómetro sigue corriendo, intentar readquirir
                        if (state.chronometer.state === 'Running') {
                            requestWakeLock();
                        }
                    });
                } catch (err) {
                    console.log('Wake Lock no disponible:', err);
                }
            }
        }

        async function releaseWakeLock() {
            if (wakeLock) {
                try {
                    await wakeLock.release();
                    wakeLock = null;
                } catch (err) {
                    console.log('Error al liberar Wake Lock:', err);
                }
            }
        }

        // --- NUEVO: Solicitar permiso de notificaciones ---
        async function requestNotificationPermission() {
            if ('Notification' in window && notificationsPermission === 'default') {
                const result = await Notification.requestPermission();
                notificationsPermission = result;
            }
        }

        // --- NUEVO: Mostrar notificación del cronómetro en segundo plano ---
        function showChronoBackgroundNotification() {
            if (state.chronometer.state !== 'Running') return;
            const totalMs = state.chronometer.accumulatedMs + (state.chronometer.startTime ? (Date.now() - state
                .chronometer.startTime) : 0);
            const timeStr = formatTime(totalMs);

            // Actualizar el badge flotante
            const bgNotif = document.getElementById('chrono-background-notification');
            const bgTime = document.getElementById('chrono-bg-time');
            if (bgNotif && bgTime) {
                bgTime.textContent = timeStr;
                bgNotif.classList.remove('scale-0');
                bgNotif.classList.add('scale-100');
            }

            // Intentar mostrar notificación del sistema si hay permiso
            if (notificationsPermission === 'granted' && document.hidden) {
                try {
                    // Cancelar notificaciones anteriores del cronómetro
                    if (window._chronoNotification) {
                        window._chronoNotification.close();
                    }
                    window._chronoNotification = new Notification('⏱️ Cronómetro activo', {
                        body: `Tiempo en curso: ${timeStr}`,
                        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%231A73E8"/><text x="50" y="55" text-anchor="middle" fill="white" font-size="40" font-weight="bold">T</text></svg>',
                        tag: 'chrono-notification',
                        requireInteraction: false,
                        silent: true,
                    });
                } catch (e) {
                    // Fallback silencioso
                }
            }
        }

        function hideChronoBackgroundNotification() {
            const bgNotif = document.getElementById('chrono-background-notification');
            if (bgNotif) {
                bgNotif.classList.remove('scale-100');
                bgNotif.classList.add('scale-0');
            }
            if (window._chronoNotification) {
                window._chronoNotification.close();
                window._chronoNotification = null;
            }
            if (chronoNotificationInterval) {
                clearInterval(chronoNotificationInterval);
                chronoNotificationInterval = null;
            }
        }

        // --- NUEVO: Manejo de visibilidad de la página ---
        function handleVisibilityChange() {
            if (document.hidden) {
                // La página pasa a segundo plano
                if (state.chronometer.state === 'Running') {
                    // Iniciar notificaciones periódicas
                    showChronoBackgroundNotification();
                    chronoNotificationInterval = setInterval(() => {
                        showChronoBackgroundNotification();
                    }, 30000); // Cada 30 segundos
                    // Guardar estado para persistencia
                    saveState();
                }
            } else {
                // La página vuelve a primer plano
                hideChronoBackgroundNotification();
                if (state.chronometer.state === 'Running') {
                    // Recalcular el tiempo y actualizar UI
                    updateChronoUI();
                    // Re-solicitar wake lock
                    requestWakeLock();
                }
            }
        }

        // --- CRONÓMETRO MEJORADO CON SOPORTE EN SEGUNDO PLANO ---
        function startChrono() {
            if (state.chronometer.state === 'Running') return;
            if (state.chronometer.state === 'Paused') {
                // Reanudar desde pausa
                state.chronometer.startTime = Date.now();
                state.chronometer.state = 'Running';
                saveState();
                updateChronoUI();
                requestWakeLock();
                requestNotificationPermission();
                return;
            }
            // Estado Stopped: iniciar desde cero
            state.chronometer.accumulatedMs = 0;
            state.chronometer.startTime = Date.now();
            state.chronometer.state = 'Running';
            saveState();
            updateChronoUI();
            requestWakeLock();
            requestNotificationPermission();
        }

        function pauseChrono() {
            if (state.chronometer.state !== 'Running') return;
            const elapsed = Date.now() - (state.chronometer.startTime || Date.now());
            state.chronometer.accumulatedMs += elapsed;
            state.chronometer.startTime = null;
            state.chronometer.state = 'Paused';
            saveState();
            updateChronoUI();
            releaseWakeLock();
            hideChronoBackgroundNotification();
        }

        function stopChrono() {
            if (state.chronometer.state === 'Stopped') return;
            let totalMs = state.chronometer.accumulatedMs;
            if (state.chronometer.state === 'Running' && state.chronometer.startTime) {
                totalMs += (Date.now() - state.chronometer.startTime);
            }
            // Resetear el cronómetro antes de mostrar el modal
            state.chronometer = { accumulatedMs: 0, startTime: null, state: 'Stopped' };
            if (chronoInterval) clearInterval(chronoInterval);
            saveState();
            updateChronoUI();
            releaseWakeLock();
            hideChronoBackgroundNotification();
            const totalMinutes = getMinutesFromMs(totalMs);
            if (totalMinutes > 0) {
                showSaveSessionModal(totalMinutes);
            } else {
                notify("No hay tiempo acumulado para guardar");
            }
        }

        function updateChronoUI() {
            const display = document.getElementById('chrono-display');
            const startBtn = document.getElementById('chrono-start-btn');
            const pauseBtn = document.getElementById('chrono-pause-btn');
            const stopBtn = document.getElementById('chrono-stop-btn');
            if (!display) return;
            if (chronoInterval) clearInterval(chronoInterval);

            if (state.chronometer.state === 'Running') {
                startBtn.classList.add('hidden');
                pauseBtn.classList.remove('hidden');
                stopBtn.classList.remove('hidden');
                chronoInterval = setInterval(() => {
                    const elapsed = state.chronometer.accumulatedMs + (state.chronometer.startTime ? (Date
                        .now() - state.chronometer.startTime) : 0);
                    display.innerText = formatTime(elapsed);
                    // Si está visible, ocultar badge de segundo plano
                    if (!document.hidden) {
                        hideChronoBackgroundNotification();
                    }
                }, 200);
            } else if (state.chronometer.state === 'Paused') {
                startBtn.classList.remove('hidden');
                startBtn.innerText = "Reanudar";
                pauseBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
                display.innerText = formatTime(state.chronometer.accumulatedMs);
            } else {
                startBtn.classList.remove('hidden');
                startBtn.innerText = "Iniciar";
                pauseBtn.classList.add('hidden');
                stopBtn.classList.add('hidden');
                display.innerText = "00:00:00";
            }
        }

        function changeCalendarMonth(delta) {
            let y = window._calendarYear || new Date().getFullYear();
            let m = (window._calendarMonth || new Date().getMonth()) + delta;
            if (m < 0) { m = 11;
                y--; }
            if (m > 11) { m = 0;
                y++; }
            window._calendarYear = y;
            window._calendarMonth = m;
            renderCalendarGrid(y, m);
            const monthName = new Date(y, m, 1).toLocaleDateString('es-ES', { month: 'long' });
            document.querySelector('#app-container h2').textContent = `${monthName} ${y}`;
        }

        function renderCalendarGrid(year, month) {
            const grid = document.getElementById('calendar-grid');
            if (!grid) return;

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${(month+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                const record = state.dailyRecords.find(r => r.date === dateStr);

                grid.innerHTML += `

            if (historialFilterMonth) {

                const term = historialSearchTerm.toLowerCase();
                records = records.filter(r =>
                    r.notes?.toLowerCase().includes(term) ||
                    r.date.includes(term) ||
                    (r.attendedStudies || []).some(sId => {
                        const s = state.studies.find(st => st.id === sId);
                        return s && s.name.toLowerCase().includes(term);
                    }) ||
                    (r.attendedRevisits || []).some(rId => {
                        const rv = state.revisits.find(r => r.id === rId);
                        return rv && rv.nameOrReference.toLowerCase().includes(term);

            const mesesDisponibles = [...new Set(state.dailyRecords.map(r => r.date.substring(0, 7)))].sort().reverse();

        function editDay(dateStr) {

                attendedStudies: [], attendedRevisits: [] };

        function getLast6MonthsData() {
            const now = new Date();
            const data = [];
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const month = d.getMonth();
                const year = d.getFullYear();
                const monthLabel = d.toLocaleDateString('es-ES', { month: 'short' });
                const hours = state.dailyRecords.filter(r => {
                    const rd = new Date(r.date + 'T12:00:00');
                    return rd.getMonth() === month && rd.getFullYear() === year;
                }).reduce((acc, curr) => acc + (curr.totalMinutes / 60), 0);
                data.push({ label: monthLabel, hours: hours, month: month, year: year });
            }
            return data;
        }

        function generateBarChartSvg(data, goal) {
            const maxHours = Math.max(goal, ...data.map(d => d.hours), 1);
            const barWidth = 40;
            const chartHeight = 180;
            const chartWidth = data.length * (barWidth + 16) + 20;
            const goalY = chartHeight - (goal / maxHours) * chartHeight;
            let bars = '';
            data.forEach((d, i) => {
                const barHeight = Math.max(4, (d.hours / maxHours) * chartHeight);
                const x = 30 + i * (barWidth + 16);
                const y = chartHeight - barHeight + 20;
                const color = d.hours >= goal ? '#10B981' : '#1A73E8';
                bars += `
                    <rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" rx="8" fill="${color}" class="bar-chart-bar"/>
                    <text x="${x + barWidth/2}" y="${chartHeight + 36}" text-anchor="middle" class="text-[10px] font-bold" fill="#94A3B8">${d.label}</text>
                    <text x="${x + barWidth/2}" y="${y - 8}" text-anchor="middle" class="text-[10px] font-bold" fill="#475569">${d.hours.toFixed(1)}</text>
                `;
            });
            return `
                <svg viewBox="0 0 ${chartWidth + 30} ${chartHeight + 55}" class="w-full max-w-[500px] mx-auto" style="min-width:300px;">
                    <line x1="20" y1="${goalY + 20}" x2="${chartWidth}" y2="${goalY + 20}" stroke="#EF4444" stroke-dasharray="6,4" stroke-width="1.5"/>
                    <text x="20" y="${goalY + 14}" class="text-[9px] font-bold" fill="#EF4444">Meta</text>
                    ${bars}
                </svg>
            `;
        }

        function getRemainingDaysInMonth() {
            const now = new Date();
            const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            return end.getDate() - now.getDate();
        }

        function getMonthlyRevisitsCount() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            let count = 0;
            state.dailyRecords.forEach(r => {
                const d = new Date(r.date + 'T12:00:00');
                if (d.getMonth() === currentMonth && d.getFullYear() === currentYear) {
                    count += r.attendedRevisits?.length || 0;
                }
            });
            return count;
        }

        function getMonthlyHours() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            return state.dailyRecords.filter(r => {
                const d = new Date(r.date + 'T12:00:00');
                return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            }).reduce((acc, curr) => acc + (curr.totalMinutes / 60), 0);
        }

        function getAnnualHours() {
            const range = getServiceYearRange();
            return state.dailyRecords.filter(r => {
                const d = new Date(r.date + 'T12:00:00');
                return d >= range.start && d <= range.end;
            }).reduce((acc, curr) => acc + (curr.totalMinutes / 60), 0);
        }

        function getUniqueMonthlyStudies() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            const monthlyStudies = new Set();
            state.dailyRecords.forEach(r => {
                const d = new Date(r.date + 'T12:00:00');
                if (d.getMonth() === currentMonth && d.getFullYear() === currentYear) {
                    (r.attendedStudies || []).forEach(sId => monthlyStudies.add(sId));
                }
            });
            return monthlyStudies.size;
        }

        function exportDataCSV() {
            let csv = "Fecha,Horas,Minutos,Estudios,Revisitas,Notas\n";
            const sorted = [...state.dailyRecords].sort((a, b) => a.date.localeCompare(b.date));
            sorted.forEach(r => {
                const estudios = (r.attendedStudies || []).map(sId => {
                    const s = state.studies.find(st => st.id === sId);
                    return s ? s.name : '';
                }).filter(Boolean).join('; ');
                const revisitas = (r.attendedRevisits || []).map(rId => {
                    const rv = state.revisits.find(r => r.id === rId);
                    return rv ? rv.nameOrReference : '';
                }).filter(Boolean).join('; ');
                const notas = (r.notes || '').replace(/"/g, '""');
                csv +=
                    `"${r.date}",${(r.totalMinutes/60).toFixed(2)},${r.totalMinutes},"${estudios}","${revisitas}","${notas}"\n`;
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "tiempo_campo_pro_registros_" + getDateStr(new Date()) + ".csv";
            link.click();
            notify("📊 Datos exportados (CSV)");
        }

        function importDataPrompt() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.dailyRecords && imported.studies && imported.revisits) {
                            if (confirm(
                                    `¿Importar datos? Se fusionarán con los actuales. Se añadirán ${imported.dailyRecords.length} registros, ${imported.studies.length} estudios, ${imported.revisits.length} revisitas.`
                                    )) {
                                state.dailyRecords = [...state.dailyRecords, ...imported.dailyRecords];
                                state.studies = [...state.studies, ...imported.studies];
                                state.revisits = [...state.revisits, ...imported.revisits];
                                if (imported.userSettings) state.userSettings = { ...state.userSettings,
                                    ...imported.userSettings };
                                saveState();
                                notify("✅ Datos importados correctamente");
                                renderView();
                            }
                        } else {
                            alert("Archivo no válido. Debe contener dailyRecords, studies y revisits.");
                        }
                    } catch (err) {
                        alert("Error al leer el archivo: " + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // --- MODIFICADO: persistSession ahora usa el time picker ---
        function persistSession() {
            const minutes = getTimePickerTotalMinutes();
            const notes = document.getElementById('save-notes').value;
            const studyChips = document.querySelectorAll('#modal-studies-list .study-chip.bg-accent');
            const attendedStudies = Array.from(studyChips).map(c => c.dataset.id);
            const revisitChips = document.querySelectorAll('#modal-revisits-list .revisit-chip.bg-accent');
            const attendedRevisits = Array.from(revisitChips).map(c => c.dataset.id);
            const todayStr = getDateStr(new Date());
            let record = state.dailyRecords.find(r => r.date === todayStr);
            if (record) {
                record.totalMinutes += minutes;
                record.notes = record.notes ? record.notes + " | " + notes : notes;
                record.attendedStudies = [...new Set([...(record.attendedStudies || []), ...attendedStudies])];
                record.attendedRevisits = [...new Set([...(record.attendedRevisits || []), ...attendedRevisits])];
                record.revisitsCount = record.attendedRevisits.length;
                record.studySessionsCount = record.attendedStudies.length;
            } else {
                state.dailyRecords.push({ date: todayStr, totalMinutes: minutes, notes, attendedStudies,
                    attendedRevisits, revisitsCount: attendedRevisits.length, studySessionsCount: attendedStudies
                    .length });
            }
            attendedRevisits.forEach(rid => {
                const rev = state.revisits.find(r => r.id === rid);
                if (rev) rev.lastVisitDate = todayStr;
            });
            saveState();
            closeModal();
            notify("✅ Actividad registrada");
            renderView();
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            loadState();

            // NUEVO: Verificar soporte de Wake Lock
            if ('wakeLock' in navigator) {
                wakeLockSupported = true;
            }

            // NUEVO: Verificar permiso de notificaciones al cargar
            if ('Notification' in window) {
                notificationsPermission = Notification.permission;
            }

            // NUEVO: Listener de cambio de visibilidad
            document.addEventListener('visibilitychange', handleVisibilityChange);

            // NUEVO: Si el cronómetro estaba corriendo al cargar, reanudar
            if (state.chronometer.state === 'Running') {
                // Ya se recalculó en loadState, ahora iniciamos el intervalo
                updateChronoUI();
                requestWakeLock();
                if (document.hidden) {
                    showChronoBackgroundNotification();
                    chronoNotificationInterval = setInterval(() => {
                        showChronoBackgroundNotification();
                    }, 30000);
                }
            }

            if (!state.chronometer.startTime && state.chronometer.state === 'Running') {
                state.chronometer.state = 'Stopped';
                state.chronometer.accumulatedMs = 0;
            }
            switchView('hoy');
            document.getElementById('modal-container').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
            const range = getServiceYearRange();
            const startMonth = range.start.toLocaleDateString('es-ES', { month: 'short' });
            const endMonth = range.end.toLocaleDateString('es-ES', { month: 'short' });
            document.getElementById('service-year-badge').textContent =
                `${startMonth} ${range.start.getFullYear()} - ${endMonth} ${range.end.getFullYear()}`;
        });

        window.addEventListener('beforeunload', () => {
            if (state.chronometer.state === 'Running' && state.chronometer.startTime) {
                const elapsed = Date.now() - state.chronometer.startTime;
                state.chronometer.accumulatedMs += elapsed;
                state.chronometer.startTime = null;
                state.chronometer.state = 'Paused';
                saveState();
            }
            releaseWakeLock();
            hideChronoBackgroundNotification();
        });

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js")
                .then(reg => console.log("Service Worker registrado:", reg))
                .catch(err => console.error("Error al registrar SW:", err));
        }
        if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js")
      .then(reg => console.log("Service Worker registrado:", reg))
      .catch(err => console.error("Error al registrar SW:", err));
  }
    </script>
</body>
